{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kisanmandi.fullname" . }}-api
  labels:
    {{- include "kisanmandi.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "kisanmandi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  strategy:
    # RollingUpdate, not Recreate: no downtime on a version bump. With
    # replicas: 1 this still means a brief overlap rather than an outage.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "kisanmandi.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Rolls the pods when config changes, so you don't have to remember to.
        checksum/config: {{ include "kisanmandi.commonEnv" . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--host", "0.0.0.0", "--port", "8000"]

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            {{- include "kisanmandi.commonEnv" . | nindent 12 }}
            - name: API_HOST
              value: "0.0.0.0"
            - name: API_PORT
              value: "8000"
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}

          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # the app writes quality reports
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: data
              mountPath: /app/data

      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kisanmandi.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
