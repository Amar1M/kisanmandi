name: Publish Karnataka price guide

on:
  push:
    branches: [main]
    paths:
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kisanmandi-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static price guide
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site snapshot
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
