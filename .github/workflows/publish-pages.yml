name: Publish Karnataka price guide

on:
  workflow_dispatch:
  schedule:
    # 18:30 Asia/Kolkata (13:00 UTC). Scheduled runs can be delayed by GitHub.
    - cron: "0 13 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kisanmandi-pages
  cancel-in-progress: false

jobs:
  ingest-and-publish:
    name: Bounded ingest and static Pages release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Required secret; the program refuses the shared demo key when it is absent.
      DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      DATA_GOV_RESOURCE_ID: 9ef84268-d588-465a-a308-a864a43d0070
      PAGE_SIZE: "1000"
      MAX_PAGES: "10"
      MAX_RETRIES: "2"
      MIN_REQUEST_INTERVAL_SECONDS: "1.0"
      REQUEST_TIMEOUT_SECONDS: "30"
      DATABASE_URL: sqlite:///./data/kisanmandi-public.db
      DATA_DIR: ./data
      LANDING_BACKEND: local
      LANDING_LOCAL_DIR: ./data/landing
      STALENESS_DAYS: "7"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Require a personal data.gov.in key
        shell: bash
        run: |
          if [[ -z "${DATA_GOV_API_KEY}" ]]; then
            echo "DATA_GOV_API_KEY repository secret is missing; refusing the shared demo key."
            exit 1
          fi

      - name: Ingest and quality-check Karnataka prices
        run: python scripts/run_public_ingest.py

      - name: Export the public static site
        run: python scripts/export_static_site.py --output-dir public

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
