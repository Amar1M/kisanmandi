[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kisanmandi"
version = "0.1.0"
description = "Mandi price intelligence for Indian farmers — ingest, validate, forecast, advise."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amarnath Reddy" }]
keywords = ["agriculture", "agmarknet", "data-engineering", "devops", "india"]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "SQLAlchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21"]

[project.scripts]
kisanmandi = "kisanmandi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Tests run against src/ without an editable install — one less setup step for a
# grader who clones your repo.
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/kisanmandi"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]
ignore = [
    "E501",  # long lines are handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests when you mean it
